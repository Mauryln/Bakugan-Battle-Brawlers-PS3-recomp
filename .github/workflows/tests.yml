# The game itself needs a copyrighted disc dump and a full toolkit checkout, so
# it cannot be built here. Check maintained tooling and repository references.
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m compileall -q tools
      - name: Check maintained documentation and entry points
        run: python tools/test_repository_contract.py
