# The game itself needs a copyrighted disc dump and a full toolkit checkout, so
# it cannot be built here. Check tooling and the NV3089 regression fixture
# directly from the committed patch, without applying experimental patches.
name: tests

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile every script
        run: python -m compileall -q tools
      - name: Test NV3089 scaled rows from the committed patch
        shell: pwsh
        run: .\tools\test_gcm_scaled_rows.ps1 -FromPatch
